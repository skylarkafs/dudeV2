id = "juniper"
name = "Juniper Networks Junos"
vendor = "Juniper"
sys_object_id_prefixes = ["1.3.6.1.4.1.2636"]
default_vendor_image_key = "router"

[[sensors]]
name = "Operating CPU (jnxOperatingCPU)"
category = "cpu"
oid = "1.3.6.1.4.1.2636.3.1.13.1.8"
scale = 1.0
unit = "%"
is_table = true
warn_threshold = 80.0
crit_threshold = 95.0

[[sensors]]
name = "Operating Temperature (jnxOperatingTemp)"
category = "temperature"
oid = "1.3.6.1.4.1.2636.3.1.13.1.7"
scale = 1.0
unit = "C"
is_table = true
warn_threshold = 65.0
crit_threshold = 80.0

[[model_rules]]
descr_or_model_pattern = "ex"
model_name = "EX Series Switch"
image_key = "switch"
device_type_name = "Switch"

[[model_rules]]
descr_or_model_pattern = "srx"
model_name = "SRX Firewall"
image_key = "firewall"
device_type_name = "Firewall"
