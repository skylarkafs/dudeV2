sys_object_id_prefixes = ["1.3.6.1.4.1.9"]
default_vendor_image_key = "switch"

[[sensors]]
name = "CPU 5-Min Total (cpmCPUTotal5minRev)"
category = "cpu"
oid = "1.3.6.1.4.1.9.9.109.1.1.1.1.8"
scale = 1.0
unit = "%"
is_table = true
warn_threshold = 80.0
crit_threshold = 95.0

[[sensors]]
name = "Chassis Temperature (ciscoEnvMonTemperatureStatusValue)"
category = "temperature"
oid = "1.3.6.1.4.1.9.9.13.1.3.1.3"
scale = 1.0
unit = "C"
is_table = true
warn_threshold = 65.0
crit_threshold = 80.0

